<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>工具书查词 · 桌面版</title>
    <script type="module" src="/main.js" defer></script>
    <!-- 分词与繁简转换库（与浏览器扩展同源；csp:null 可直接加载，无需 sandbox iframe） -->
    <script src="https://cdn.jsdelivr.net/npm/segmentit@2.0.3/dist/umd/segmentit.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.4.2/dist/umd/full.js"></script>
  </head>
  <body>
    <!-- 主窗口 -->
    <div id="main-view" class="main-view">
      <header class="main-topbar" data-tauri-drag-region>
        <div class="main-brand" data-tauri-drag-region>
          <img class="logo" src="/assets/crfd.svg" alt="工具书查词" />
          <span class="title">工具书查词</span>
          <span class="subtitle">CNKI 工具书 · 划词查询桌面版</span>
        </div>
        <div class="main-topbar-right">
          <div class="status" id="status-dot" title="连接状态"></div>
          <div class="win-controls">
            <button class="win-btn" id="win-min" title="最小化" aria-label="最小化"></button>
            <button class="win-btn" id="win-max" title="最大化" aria-label="最大化"></button>
            <button class="win-btn win-close" id="win-close" title="关闭" aria-label="关闭"></button>
          </div>
        </div>
      </header>

      <main class="main-container">
        <section class="main-search-box">
          <input id="word-input" type="text" placeholder="输入词目，例如：Meta分析、辨证论治、循证医学…" autocomplete="off" autofocus />
          <button id="search-btn">查 词</button>
        </section>
        <section id="results" class="main-results"></section>
      </main>

      <footer class="main-foot">
        桌面划词：选中任意文字后按 <b>Ctrl+Alt+D</b>，自动唤起窗口查词。
        完整释义正文可能需要机构内网或登录态。
      </footer>
    </div>
  </body>
</html>
