<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>悬浮图标</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
      }
      #floating {
        width: 56px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(15, 40, 66, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 16px;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        transition: transform 0.15s ease, background 0.15s ease;
      }
      #floating:hover {
        transform: scale(1.06);
        background: rgba(15, 40, 66, 0.55);
      }
      #floating img {
        width: 44px;
        height: 44px;
        display: block;
        pointer-events: none;
        user-select: none;
        -webkit-user-drag: none;
      }
    </style>
  </head>
  <body>
    <div id="floating">
      <img src="/assets/crfd.svg" alt="工具书查词" draggable="false" />
    </div>
    <script>
      // 悬浮图标入口：单击唤起主窗口（查词界面）；按住拖动可移动
      // 注意：不能用 data-tauri-drag-region —— 它会在 mousedown 即抢占原生拖拽，
      // 导致 GTK 下 click 事件不可靠；这里改用手动指针事件 + start_dragging
      const { invoke } = window.__TAURI__.core;
      const el = document.getElementById('floating');
      let downX = 0, downY = 0;
      let moved = false;
      let dragging = false;

      el.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return;
        downX = e.screenX;
        downY = e.screenY;
        moved = false;
        dragging = false;
        try {
          el.setPointerCapture(e.pointerId);
        } catch (_) {}
      });

      el.addEventListener('pointermove', (e) => {
        if (e.buttons !== 1) return;
        const dx = e.screenX - downX;
        const dy = e.screenY - downY;
        if (!dragging && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) {
          dragging = true;
          invoke('plugin:window|start_dragging').catch(() => {});
        }
        if (dragging) moved = true;
      });

      el.addEventListener('pointerup', (e) => {
        if (e.button !== 0 || dragging) return;
        if (!moved) {
          invoke('focus_main');
        }
      });
    </script>
  </body>
</html>
