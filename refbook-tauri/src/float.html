<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>悬浮图标</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
      }
      #floating {
        width: 56px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(15, 40, 66, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 16px;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        transition: transform 0.15s ease, background 0.15s ease;
      }
      #floating:hover {
        transform: scale(1.06);
        background: rgba(15, 40, 66, 0.55);
      }
      #floating img {
        width: 44px;
        height: 44px;
        display: block;
        pointer-events: none;
        user-select: none;
        -webkit-user-drag: none;
      }
    </style>
  </head>
  <body>
    <div id="floating" data-tauri-drag-region>
      <img src="/assets/crfd.svg" alt="工具书查词" draggable="false" />
    </div>
    <script>
      // 悬浮图标入口：单击唤起主窗口；按住可拖拽移动
      const { invoke } = window.__TAURI__.core;
      const el = document.getElementById('floating');
      let down = { x: 0, y: 0 };
      let moved = false;

      el.addEventListener('pointerdown', (e) => {
        down = { x: e.screenX, y: e.screenY };
        moved = false;
      });
      el.addEventListener('pointermove', (e) => {
        if (Math.abs(e.screenX - down.x) > 3 || Math.abs(e.screenY - down.y) > 3) {
          moved = true;
        }
      });
      el.addEventListener('click', (e) => {
        if (e.button !== 0 || moved) return;
        invoke('focus_main');
      });
    </script>
  </body>
</html>
