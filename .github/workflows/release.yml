name: Release

# 打 tag v*（如 v0.2.0）时构建三平台安装包并发布到 GitHub Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
      release_upload_url: ${{ steps.create-release.outputs.upload_url }}
      release_body: ${{ steps.tag.outputs.message }}

    steps:
      - uses: actions/checkout@v5

      - name: Get version
        id: get_version
        shell: bash
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version-without-v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Get tag message
        id: tag
        run: |
          git fetch --depth=1 origin +refs/tags/*:refs/tags/*
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$(git tag -l --format='%(contents)' ${{ steps.get_version.outputs.version }})" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create-release
        uses: ncipollo/release-action@v1
        with:
          draft: true
          name: ${{ steps.get_version.outputs.version }}
          tag: ${{ steps.get_version.outputs.version }}
          body: ${{ steps.tag.outputs.message }}

  build-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux
            args: --bundles deb appimage
          - os: macos-latest
            label: macos
            args: --target universal-apple-darwin
          - os: windows-latest
            label: windows
            args: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Get version
        id: get_version
        shell: bash
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version-without-v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: refbook-tauri/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: refbook-tauri/src-tauri -> target

      - name: Add macOS universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libx11-dev libxdo-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Sync version
        shell: bash
        env:
          VERSION: "${{ steps.get_version.outputs.version-without-v }}"
        run: |
          sed -i.bak "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" refbook-tauri/src-tauri/tauri.conf.json
          sed -i.bak "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" refbook-tauri/package.json
          sed -i.bak "s/^version = .*/version = \"$VERSION\"/" refbook-tauri/src-tauri/Cargo.toml
          rm -f refbook-tauri/src-tauri/tauri.conf.json.bak refbook-tauri/package.json.bak refbook-tauri/src-tauri/Cargo.toml.bak

      - name: Install frontend dependencies
        working-directory: refbook-tauri
        run: pnpm install --frozen-lockfile

      - name: Build Tauri App & upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: refbook-tauri
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseBody: ${{ needs.create-release.outputs.release_body }}
          args: ${{ matrix.args }}

  publish-release:
    needs: [create-release, build-tauri]
    runs-on: ubuntu-22.04

    steps:
      - name: Publish release
        uses: actions/github-script@v9
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
              prerelease: false
            })
