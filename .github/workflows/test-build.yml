name: Test Build

# 手动触发或 main 分支推送时构建三平台安装包并上传 artifacts（不发布 Release）
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux
            args: --bundles deb appimage
          - os: macos-latest
            label: macos
            args: --target universal-apple-darwin
          - os: windows-latest
            label: windows
            args: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: refbook-tauri/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: refbook-tauri/src-tauri -> target

      - name: Add macOS universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libx11-dev libxdo-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install frontend dependencies
        working-directory: refbook-tauri
        run: pnpm install --frozen-lockfile

      - name: Build Tauri App
        id: tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: refbook-tauri
          args: ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: refbook-${{ matrix.label }}
          if-no-files-found: warn
          path: |
            refbook-tauri/src-tauri/target/**/bundle/**/*.deb
            refbook-tauri/src-tauri/target/**/bundle/**/*.AppImage
            refbook-tauri/src-tauri/target/**/bundle/**/*.dmg
            refbook-tauri/src-tauri/target/**/bundle/**/*.app
            refbook-tauri/src-tauri/target/**/bundle/**/*.msi
            refbook-tauri/src-tauri/target/**/bundle/**/*.exe
